<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form Rewind の設定</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Form Rewind の設定</h1>
      <p class="muted">保存した入力内容はこのブラウザの中(拡張機能専用の保存領域)にだけ置かれ、外部へは送信しません。パスワード欄は保存しません。</p>

      <section>
        <h2>動作</h2>
        <label class="check"><input id="autoload" type="checkbox" /> オートロード: 「すべてのフィールドを保存」した値を、ページを開いたときに空欄へ自動で入れる</label>
      </section>

      <section>
        <div class="section-head">
          <h2>保存したフィールド(すべてのフィールドを保存)</h2>
          <a href="saved-fields.html" class="link-button">保存内容を見る・編集</a>
        </div>
        <p class="muted small">ショートカットは <code>chrome://extensions/shortcuts</code> で割り当てられます(初期状態では割り当てていません)。</p>
        <ul id="field-sets" class="rows"></ul>
      </section>
    </main>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
