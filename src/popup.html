<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Form Rewind</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div>
        <h1>Form Rewind</h1>
        <p id="domain" class="muted"></p>
      </div>
      <button id="open-options" class="icon-button" type="button" title="設定を開く" aria-label="設定を開く">⚙</button>
    </header>

    <p id="unsupported" class="notice" hidden>このページでは使えません。http / https で開いたページのフォームで使えます。</p>

    <main id="main" hidden>
      <section class="card">
        <h2>フィールドの保存</h2>
        <div class="button-row">
          <button id="fs-save" type="button" class="primary">すべてのフィールドを保存</button>
        </div>
        <div class="button-row">
          <button id="fs-load" type="button" title="Shift を押しながらクリックすると、空欄にだけ入れます">すべて読み込む</button>
          <button id="fs-clear" type="button" class="danger-quiet">消去</button>
        </div>
        <div class="fs-status-row">
          <p id="fs-status" class="muted small"></p>
          <button id="fs-view" type="button" class="link small">保存内容を見る・編集</button>
        </div>
        <label class="check"><input id="autoload" type="checkbox" /> オートロード(ページを開いたら空欄に自動で入れる)</label>
      </section>
    </main>

    <p id="message" class="message" role="status" hidden></p>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
